# Activate with: --spring.profiles.active=prod

# Server
server.port=80

# Production Database (example: PostgreSQL)
spring.datasource.url=jdbc:postgresql://your-prod-db-host:5432/proddb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=produser
spring.datasource.password=prodpassword
spring.jpa.hibernate.ddl-auto=validate

# PDF Generation
pdf.template.directory=/var/app/pdf-templates
pdf.output.directory=/var/app/pdf-output

# Email (real SMTP for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-production-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Production superadmin setup (secure mode)
# Use interactive setup mode for first-time deployment
app.production.setup-mode=${PRODUCTION_SETUP_MODE:false}

# SECURITY NOTE: Do not set default credentials in production
# Use the interactive setup mode instead

# Error details for prod (do not show details)
server.error.include-message=never
server.error.include-binding-errors=never