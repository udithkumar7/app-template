# Common settings for all environments
spring.application.name=pdf-generator-template
spring.profiles.active=dev

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging
logging.level.root=INFO
logging.level.com.template=DEBUG

# JWT
jwt.secret=your-secret-key-here-make-it-long-and-secure-for-production
jwt.expiration=600000
jwt.refresh-expiration=604800000

# Account/session
auth.max-sessions-per-user=1
auth.max-login-attempts=5
auth.lock-duration-minutes=10
auth.account-expiry-years=3
auth.max-refresh-tokens-per-user=5

# OTP
app.otp.length=6
app.otp.expiry-minutes=10

# Default data initialization (DEV ONLY - No defaults for security)
# app.init.superadmin.username=
# app.init.superadmin.password=
# app.init.superadmin.email=
# app.init.force-superadmin-creation=false

# Error details for dev/test (override in prod)
server.error.include-message=always
server.error.include-binding-errors=always

# Rate Limiting Configuration
app.rate-limit.otp.max-requests=5
app.rate-limit.otp.window-minutes=15